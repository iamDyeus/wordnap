[project]
name = "sentence-mixer"
version = "0.1.0"
description = "Local-first video editing engine that constructs sentences by splicing word-level clips from indexed video libraries"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
transcription = [
    "whisperx>=3.0",
]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "pytest-cov>=4.0",
]

[project.scripts]
sentence-mixer = "sentence_mixer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentence_mixer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.hypothesis]
database_backend = "directory"
